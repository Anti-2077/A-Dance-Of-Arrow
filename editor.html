<section id="community" class="screen">
 <div class="heading"><div><div class="eyebrow">LOCAL CHART LIBRARY</div><h2>내 기기 채보 보관함</h2></div><button class="back">← 메인으로</button></div>
 <div class="panel" style="margin-bottom:14px">
  <h3>이 브라우저에 저장된 채보</h3><p class="muted">여기에 등록한 채보는 현재 브라우저에서만 보관됩니다.</p>
  <div class="event-form"><button class="primary" id="refreshCharts">목록 새로고침</button><span id="cloudStatus" class="muted">기기 내 저장 모드입니다.</span></div>
  <div id="publicChartList" class="list"></div>
 </div>
 <div class="panel" style="margin-bottom:14px">
  <h3>채보 저장 도구</h3><p class="muted">개발자 코드를 입력하면 현재 에디터 채보 또는 JSON 채보를 이 기기에 저장할 수 있습니다.</p>
  <div class="event-form"><input id="developerCodeInput" type="password" placeholder="개발자 코드" autocomplete="off" style="width:min(280px,100%)"><button id="unlockDeveloper" class="primary">개발자 메뉴 열기</button><button id="lockDeveloper">잠그기</button></div>
  <div id="developerTools" hidden style="margin-top:16px">
   <h3>에디터 채보 저장</h3><label>곡 이름 <input id="uploadTitle" maxlength="100" placeholder="곡 이름"></label> <label>제작자 <input id="uploadArtist" maxlength="80" placeholder="제작자 또는 닉네임"></label> <label>난이도 <select id="uploadDifficulty"><option>Easy</option><option selected>Normal</option><option>Hard</option><option>Expert</option><option>Special</option></select></label> <button id="uploadCurrentChart" class="primary">현재 에디터 채보 저장</button>
   <hr style="border-color:var(--line);margin:18px 0">
   <h3>JSON 채보 파일 저장</h3><p class="muted">이 사이트에서 내보낸 rhythm-chart.json 형식의 파일을 선택하세요.</p><label class="filebutton">JSON 파일 선택<input id="chartJsonFile" type="file" accept="application/json,.json"></label> <label>곡 이름 <input id="jsonTitle" maxlength="100" placeholder="곡 이름"></label> <label>제작자 <input id="jsonArtist" maxlength="80" placeholder="제작자 또는 닉네임"></label> <label>난이도 <select id="jsonDifficulty"><option>Easy</option><option selected>Normal</option><option>Hard</option><option>Expert</option><option>Special</option></select></label> <button id="uploadJsonChart" class="primary">선택한 JSON 저장</button>
   <p class="help">참고: 채보 데이터는 이 브라우저에 저장됩니다. 음원 파일은 별도로 관리됩니다.</p>
  </div>
 </div>
</section>
