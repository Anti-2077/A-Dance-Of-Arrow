<!-- Loaded by index.html. Keep the existing game IDs intact for app compatibility. -->
<section id="game-select" class="screen">
 <div class="heading"><div><div class="eyebrow">SONG SELECT</div><h2>곡 선택</h2></div><button class="back">← 메인으로</button></div>
 <div class="panel">
  <h3>플레이할 곡을 선택하세요</h3>
  <p class="muted">곡을 선택하면 일반 플레이 화면으로 이동합니다.</p>
  <div class="toolbar"><button class="primary" id="refreshGameCharts">곡 목록 새로고침</button><span id="gameChartStatus" class="muted">곡을 불러오는 중…</span></div>
  <div id="gameChartList" class="list"></div>
 </div>
</section>
<section id="game" class="screen">
 <div class="heading"><div><div class="eyebrow">PLAY MODE</div><h2>게임 플레이</h2></div><button id="gameBackToSelect">← 곡 선택</button></div>
 <div class="panel">
  <div class="toolbar"><strong id="gameTitle">곡을 선택해 주세요</strong><span class="muted" id="gameStats"></span><span style="flex:1"></span><button class="primary" id="gamePlay">▶ 시작</button><button id="gamePause">Ⅱ 일시정지</button><button id="gameRestart">↻ 다시 시작</button></div>
  <div id="gameStage" class="game-stage"><div class="game-lanes" id="gameLanes"></div><div class="game-targets" id="gameTargets"></div><div class="game-notes" id="gameNotes"></div><div class="game-overlay" id="gameOverlay">곡을 선택해 주세요</div></div>
  <div class="timeline-foot" aria-hidden="true"><span id="gameClock">0.000s</span><input id="gameSeek" type="range" min="0" max="100" value="0" tabindex="-1"><span id="gameLength">노트 재생</span></div>
  <p class="help">키보드의 설정된 레인 키를 눌러 플레이하세요.</p>
 </div>
</section>
